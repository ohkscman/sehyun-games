<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세현이 글자 놀이</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5bb9ff">
<meta name="description" content="그림을 보고 맞는 글자를 콕! 세현이의 한글·영어 놀이 두 가지">
<meta property="og:type" content="website">
<meta property="og:title" content="세현이 글자 놀이">
<meta property="og:description" content="낱말 카드 대작전 · 글자 블록 대작전 — 세현이의 한글·영어 놀이">
<meta property="og:url" content="https://ohkscman.github.io/sehyun-games/">
<meta property="og:image" content="https://ohkscman.github.io/sehyun-games/cards/og-image.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세현이 글자 놀이">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: one column of two big app tiles on the same sky-blue toy-box ground as the games */
:root{
  --sky:#5bb9ff; --sky-dot:rgba(255,255,255,.18); --ink:#14234b; --sun:#ffd23f; --card:#ffffff; --tint:#e8f5ff; --muted:#53618c;
  --f-display:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;min-height:100vh;background-color:var(--sky);
  background-image:radial-gradient(circle,var(--sky-dot) 0 5px,transparent 6px);background-size:34px 34px;
  color:var(--ink);font-family:var(--f-body);
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;text-align:center;font-family:var(--f-display);font-weight:normal;font-size:clamp(2rem,8vw,2.8rem);
  color:var(--card);text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);text-wrap:balance}
.lead{margin:0;text-align:center;font-size:1.2rem}
a.app{
  display:flex;align-items:center;gap:16px;padding:16px 18px;text-decoration:none;color:var(--ink);
  background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);
}
a.app:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
a.app:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
a.app img{width:84px;height:84px;border-radius:20px;border:3px solid var(--ink);flex:none}
.name{font-family:var(--f-display);font-size:1.6rem;display:block}
.what{font-size:1.05rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>세현이 글자 놀이</h1>
  <p class="lead">그림을 보고 맞는 글자를 콕! 한글도 영어도 같이 해요.</p>
  <a class="app" href="../cards/">
    <img src="../cards/icon-192.png" alt="">
    <span><span class="name">낱말 카드 대작전</span><span class="what">카드 4장 중에서 천천히 골라요</span></span>
  </a>
  <a class="app" href="../blocks/">
    <img src="../blocks/icon-192.png" alt="">
    <span><span class="name">글자 블록 대작전</span><span class="what">떨어지는 글자 블록을 맞혀요</span></span>
  </a>
</main>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('../sw.js').catch(() => {}); });
</script>
</body>
</html>
